name: MusicRoom
options:
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: 5.0
  MARKETING_VERSION: 0.1.33
  CURRENT_PROJECT_VERSION: 34
  GENERATE_INFOPLIST_FILE: YES
  INFOPLIST_KEY_CFBundleDisplayName: iPlex
  INFOPLIST_KEY_NSLocalNetworkUsageDescription: iPlex connects to your Plex Media Server.
targets:
  MusicRoom-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Assets/VideoLAN-SOURCE.txt
        buildPhase: resources
      - path: Assets/VideoLAN-LICENSE.txt
        buildPhase: resources
      - path: Assets/wordmark.png
        buildPhase: resources
      - path: Assets/music-wordmarks.png
        buildPhase: resources
      - path: Assets/GlassBackgrounds
        type: folder
        buildPhase: resources
      - path: Assets/HeaderMarks
        type: folder
        buildPhase: resources
      - path: Mobile/iOSIconPreviews
        type: folder
        buildPhase: resources
      - path: Mobile/iOS.xcassets
        buildPhase: resources
    dependencies:
      - framework: Dependencies/MobileVLCKit.xcframework
        embed: true
    info:
      path: Mobile/iOS-Info.plist
      properties:
        CFBundleDisplayName: iPlex
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: iPlex connects to your Plex Media Server.
    settings:
      PRODUCT_NAME: iPlex
      PRODUCT_BUNDLE_IDENTIFIER: net.bentley734.musicroom.ios
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "PrismaticNoteDark MusicGradient MusicWordmark MusicCrimson MusicMonochrome MusicOrange MusicArtists MusicPink Napster NapsterMono Spotify Plex WmpClassic MediaPlayerClassic WmpGlass VlcClassic Vlc Quicktime ItunesDisc Itunes11"
  MusicRoom-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Assets/VideoLAN-SOURCE.txt
        buildPhase: resources
      - path: Assets/VideoLAN-LICENSE.txt
        buildPhase: resources
      - path: Assets/wordmark.png
        buildPhase: resources
      - path: Assets/music-wordmarks.png
        buildPhase: resources
      - path: Assets/GlassBackgrounds
        type: folder
        buildPhase: resources
      - path: Assets/HeaderMarks
        type: folder
        buildPhase: resources
      - path: Mobile/TVIconPreviews
        type: folder
        buildPhase: resources
      - path: Mobile/tvOS.xcassets
        buildPhase: resources
    dependencies:
      - framework: Dependencies/TVVLCKit.xcframework
        embed: true
    info:
      path: Mobile/tvOS-Info.plist
      properties:
        CFBundleDisplayName: iPlex
        UIBackgroundModes: [audio]
    settings:
      PRODUCT_NAME: iPlex
      PRODUCT_BUNDLE_IDENTIFIER: net.bentley734.musicroom.tvos
      ASSETCATALOG_COMPILER_APPICON_NAME: TVBrand
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "PrismaticNoteDark MusicGradient MusicWordmark MusicCrimson MusicMonochrome MusicOrange MusicArtists MusicPink Napster NapsterMono Spotify Plex WmpClassic MediaPlayerClassic WmpGlass VlcClassic Vlc Quicktime ItunesDisc Itunes11"
